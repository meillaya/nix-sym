name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    name: flake / linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check
      - name: Evaluate aarch64 outputs
        run: |
          nix eval --raw .#packages.aarch64-linux.nix-sym.name
          nix eval --raw .#checks.aarch64-linux.default.drvPath
      - name: Build package
        run: nix build .#nix-sym

  integration:
    name: cores / linux
    runs-on: ubuntu-24.04
    env:
      NIX_SYM_REQUIRE_CORE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Integration tests
        run: nix develop .#ci --command bash scripts/test-integration.sh

  sanitize:
    name: sanitizers / linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: ASan and UBSan
        run: nix develop .#ci --command bash scripts/check-sanitize.sh

  fuzz:
    name: fuzz / linux
    runs-on: ubuntu-24.04
    env:
      FUZZ_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Demangler and JSON fuzz targets
        run: nix develop .#fuzz --command bash scripts/check-fuzz.sh

  format:
    name: format / linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: clang-format
        run: >
          nix develop .#format --command
          bash -c 'clang-format --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp tests/unit/*.cpp'
